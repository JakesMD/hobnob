tasks:
  install:
    info: Installs hobnob with tab completion
    steps:
      - run: ./install.sh

  go:build:
    info: Builds the Go application
    steps:
      - run: go build -o hobnob ./cmd/hobnob

  go:test:
    info: Runs Go tests
    steps:
      - run: go test ./...

  go:test:unit:
    info: Runs unit/integration tests only (fast inner loop, skips the e2e suite)
    steps:
      - run: go test $(go list ./... | grep -v /internal/e2e)

  go:test:e2e:
    info: Runs the end-to-end CLI test suite
    steps:
      - run: go test ./internal/e2e

  go:vet:
    info: Vets Go code
    steps:
      - run: go vet ./...

  go:lint:
    info: Lints Go code with golangci-lint, including the test-convention plugin
    steps:
      - run: go test ./...
        dir: tools/testconventions
      - run: golangci-lint custom
      - run: ./bin/custom-gcl run ./...

  go:vuln:
    info: Scans dependencies and the standard library for known vulnerabilities
    steps:
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  go:check:
    info: Vets, lints and tests Go code
    steps:
      - call: go:vet
      - call: go:lint
      - call: go:test

  go:build:release:
    info: Builds release binary for a target OS, ARCH, and VERSION
    steps:
      - call: _get_os_arch
        into:
          - OS: .OS
          - ARCH: .ARCH
      - get:
          - VERSION:
              info: Release version (e.g. v1.2.3)
      - run: GOOS={{.OS}} GOARCH={{.ARCH}} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o hobnob_release ./cmd/hobnob

  go:package:
    info: Packages release binary into a tarball
    steps:
      - call: _get_os_arch
        into:
          - OS: .OS
          - ARCH: .ARCH
      - run: mv hobnob_release hobnob
      - run: tar -czf hobnob_{{.OS}}_{{.ARCH}}.tar.gz hobnob

  go:verify:
    info: Verifies installed hobnob binary works
    steps:
      - run: hobnob --list

  release:
    info: Tags origin/main with the next version; the Release workflow builds it and writes the notes
    steps:
      - run: git fetch --quiet --tags --force origin main
      - run: git tag --list 'v*.*.*' --sort=-v:refname | head -n1
        into:
          - LATEST: stdout | trim
      - get:
          - BUMP:
              info: "Latest release is {{.LATEST}}. Which part to bump?"
              options: [patch, minor, major]
      - run: |
          v={{.LATEST}}; v=${v#v}
          major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case {{.BUMP}} in
            major) echo "v$((major + 1)).0.0" ;;
            minor) echo "v$major.$((minor + 1)).0" ;;
            patch) echo "v$major.$minor.$((patch + 1))" ;;
          esac
        into:
          - NEXT: stdout | trim
      - run: git log --oneline {{.LATEST}}..origin/main
      - get:
          - CONFIRM:
              info: "Release {{.NEXT}} from origin/main, with the commits above?"
              options: ["no", "yes"]
      - run: git tag {{.NEXT}} origin/main && git push origin {{.NEXT}}
        if: '{{ eq .CONFIRM "yes" }}'

  _get_os_arch:
    once: true
    steps:
      - get:
          - OS:
              info: Target OS
              options: [darwin, linux]
      - set: [{ARCH: arm64}]
        if: '{{eq .OS "darwin"}}'
      - get:
          - ARCH:
              info: Target architecture
              options: [arm64, amd64]

  docs:dev:
    info: Serves the docs site locally with live reload
    dir: docs
    steps:
      - run: npm install
      - run: npm run dev

  docs:build:
    info: Builds the docs site into docs/.vitepress/dist
    dir: docs
    steps:
      - run: npm ci
      - run: npm run build
