modules:
  - example:
      path: example.yml
      flatten: true

tasks:
  install:
    info: Installs hobnob with tab completion
    steps:
      - run: ./install.sh

  go:build:
    info: Builds the Go application
    steps:
      - run: go build -o hobnob ./cmd/hobnob

  go:test:
    info: Runs Go tests
    steps:
      - run: go test ./...

  go:test:unit:
    info: Runs unit/integration tests only (fast inner loop, skips the e2e suite)
    steps:
      - run: go test $(go list ./... | grep -v /internal/e2e)

  go:test:e2e:
    info: Runs the end-to-end CLI test suite
    steps:
      - run: go test ./internal/e2e

  go:vet:
    info: Vets Go code
    steps:
      - run: go vet ./...

  go:check:
    info: Vets and tests Go code
    steps:
      - call: go:vet
      - call: go:test

  go:build:release:
    info: Builds release binary for a target OS, ARCH, and VERSION
    steps:
      - use: _get_os_arch
      - get:
          - VERSION:
              info: Release version (e.g. v1.2.3)
      - run: GOOS={{.OS}} GOARCH={{.ARCH}} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o hobnob_release ./cmd/hobnob

  go:package:
    info: Packages release binary into a tarball
    steps:
      - use: _get_os_arch
      - run: mv hobnob_release hobnob
      - run: tar -czf hobnob_{{.OS}}_{{.ARCH}}.tar.gz hobnob

  go:verify:
    info: Verifies installed hobnob binary works
    steps:
      - run: hobnob --list

  _get_os_arch:
    steps:
      - get:
          - OS:
              info: Target OS
              options: [darwin, linux]
      - set: [{ARCH: arm64}]
        if: '{{eq .OS "darwin"}}'
      - get:
          - ARCH:
              info: Target architecture
              options: [arm64, amd64]
