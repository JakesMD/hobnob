tasks:
  run_with_dir:
    steps:
      - run: echo hello
        dir: /tmp/custom

  task_with_dir:
    dir: /tmp/task
    steps:
      - run: echo hello

  task_with_template_dir:
    dir: "{{.BASE_DIR}}/sub"
    steps:
      - run: echo hello

  call_with_dir:
    steps:
      - call: task_with_dir
        dir: /tmp/override

  run_with_bare_var_dir:
    steps:
      - run: echo hello
        dir: .CUSTOM_DIR

  task_with_bare_var_dir:
    dir: .BASE_DIR
    steps:
      - run: echo hello

  task_with_relative_dir:
    dir: ./relative/path
    steps:
      - run: echo hello
