tasks:
  get_text:
    steps:
      - get:
          - NAME:
              info: "Enter your name"

  get_text_check:
    steps:
      - get:
          - SIZE:
              info: "Enter size"
              check: '[ {{.SIZE}} -le 100 ]'

  get_text_default:
    steps:
      - get:
          - COLOR:
              info: "Enter color"
              default: "blue"

  get_select:
    steps:
      - get:
          - MOTOR:
              info: "Select motor"
              options:
                - "X-Axis"
                - "Y-Axis"
                - "Z-Axis"

  get_select_default:
    steps:
      - get:
          - MOTOR:
              info: "Select motor"
              default: "Y-Axis"
              options:
                - "X-Axis"
                - "Y-Axis"
                - "Z-Axis"

  get_multi:
    steps:
      - get:
          - TAGS:
              info: "Pick tags"
              multi: true
              options:
                - alpha
                - beta
                - gamma

  get_multi_vars:
    steps:
      - get:
          - NAME:
              info: "Enter name"
          - SIZE:
              info: "Enter size"
              check: '[ {{.SIZE}} -le 100 ]'

  get_bare_single:
    steps:
      - get:
          - COMMAND

  get_select_from_var:
    steps:
      - get:
          - RELEASES:
              info: "Select release"
              options: .RELEASE_LIST

  get_bare_mixed:
    steps:
      - get:
          - COMMAND
          - CHECK:
              default: pubspec.yaml
