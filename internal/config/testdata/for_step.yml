tasks:
  loop_literal:
    steps:
      - loop:
          - alpha
          - beta
          - gamma
        steps:
          - run: echo "item {{.ITEM}}"

  loop_dynamic:
    steps:
      - set:
          - FILES: '["a.txt","b.txt","c.txt"]'
      - loop: '{{.FILES}}'
        steps:
          - run: echo "file {{.ITEM}}"

  loop_custom_var:
    steps:
      - loop:
          - x
          - y
        as: NODE
        steps:
          - run: echo "node {{.NODE}}"

  loop_matrix_single:
    steps:
      - loop:
          PLATFORM: [ubuntu, macos, windows]
        steps:
          - run: echo "{{.PLATFORM}}"

  loop_matrix_multi:
    steps:
      - loop:
          PLATFORM: [ubuntu, macos]
          DB: [postgres, sqlite]
        steps:
          - run: echo "{{.PLATFORM}} - {{.DB}}"

  loop_matrix_template:
    steps:
      - loop:
          NODE: '{{.SERVERS}}'
        steps:
          - run: echo "{{.NODE}}"

  loop_dynamic_bare:
    steps:
      - loop: .FILES
        steps:
          - run: echo "{{.ITEM}}"

  loop_matrix_template_bare:
    steps:
      - loop:
          NODE: .SERVERS
        steps:
          - run: echo "{{.NODE}}"
