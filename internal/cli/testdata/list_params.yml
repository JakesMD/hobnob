tasks:
  deploy:
    info: Deploy the service to an environment
    steps:
      - get:
          - ENV:
              info: "Target environment"
          - PORT:
              info: "Port to bind"
              default: "8080"
          - RETRIES:
              info: "Retry count"
              default: "{{.DEFAULT_RETRIES}}"

  rollback:
    steps:
      - get:
          - DEPLOY_ID:
              info: "ID of deployment to roll back"
      - loop:
          - prod
          - staging
        as: TARGET
        steps:
          - get:
              - CONFIRM:
                  info: "Confirm rollback on {{.TARGET}}"

  no_params:
    info: No parameters needed
    steps:
      - run: echo "done"
