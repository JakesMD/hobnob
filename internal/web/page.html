<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hobnob</title>
<style>
:root {
  --bg: #1a2029; --bg-alt: #151a22; --bg-soft: #252d38; --term: #0f131a;
  --divider: #2e3744; --border: #3a4452;
  --t1: #eef1f5; --t2: #aeb7c3; --t3: #768191;
  --brand-1: #f6c27a; --brand-2: #e0a050; --brand-3: #d98a35; --brand-soft: rgba(217, 138, 53, 0.16);
  --btn-text: #1a2029; --alt-bg: #2c3542; --alt-hover: #3a4452;
  --red: #ff6b6b; --green: #4ec27a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --bg-alt: #f6f6f7; --bg-soft: #f1f1f3; --term: #f6f6f7;
    --divider: #e2e2e3; --border: #c2c2c4;
    --t1: #3c3c43; --t2: #67676c; --t3: #929295;
    --brand-1: #d98a35; --brand-2: #c77a28; --brand-3: #b86a1c; --brand-soft: rgba(217, 138, 53, 0.14);
    --btn-text: #ffffff; --alt-bg: #ebebef; --alt-hover: #dedee3;
    --red: #d03a3a; --green: #2f9d5b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--t1); font: 15px/1.6 var(--sans); }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
.btn { padding: 0 22px; border-radius: 24px; line-height: 40px; font-size: 15px; font-weight: 600; transition: background .2s; }
.btn.brand { color: var(--btn-text); background: var(--brand-2); }
.btn.brand:hover { background: var(--brand-1); }
.btn.alt { color: var(--t1); background: var(--alt-bg); }
.btn.alt:hover { background: var(--alt-hover); }
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--bg-alt); border-right: 1px solid var(--divider); padding: 28px 24px; display: flex; flex-direction: column; gap: 28px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--brand-1); font-size: 18px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(-45deg, #d98a35 50%, #3b4654 50%); display: inline-block; }
.taskname { font-size: 13px; color: var(--t3); }
.taskname b { display: block; font-size: 16px; color: var(--t1); font-weight: 600; margin-bottom: 2px; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.steps li { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--t3); }
.steps .m { width: 16px; text-align: center; flex: none; }
.steps li.done { color: var(--t2); }
.steps li.done .m { color: var(--green); }
.steps li.running { background: var(--brand-soft); color: var(--t1); }
.steps li.running .m { color: var(--brand-1); }
.steps li.failed { color: var(--t1); }
.steps li.failed .m { color: var(--red); }
.sep { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); padding: 12px 10px 4px; }
.main { display: flex; flex-direction: column; min-height: 100vh; }
.pagebody { flex: 1; padding: 9vh 56px 40px; max-width: 900px; width: 100%; }
h1 { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; margin: 0 0 28px; }
.bar { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 56px; border-top: 1px solid var(--divider); background: var(--bg); }
.bar .note { font-size: 13px; color: var(--t3); }
.progress { height: 6px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; max-width: 520px; position: relative; }
.progress::after { content: ''; position: absolute; inset: 0; width: 35%; border-radius: 3px; background: linear-gradient(90deg, var(--brand-3), var(--brand-1)); animation: indet 1.4s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.lastbox { margin-top: 18px; max-width: 520px; padding: 10px 14px; border-radius: 10px; background: var(--term); border: 1px solid var(--divider); font: 13px var(--mono); color: var(--t3); white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 42px; }
.clock { margin-top: 10px; font: 13px var(--mono); color: var(--t3); }
.icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; margin-bottom: 22px; }
.icon.ok { background: rgba(78,194,122,.15); color: var(--green); }
.icon.bad { background: rgba(255,107,107,.12); color: var(--red); }
.lead { color: var(--t2); max-width: 560px; margin: -14px 0 24px; }
.tasks { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
.task { width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--divider); background: var(--bg-alt); transition: border-color .2s; }
.task:hover { border-color: var(--brand-2); }
.task b { display: block; font-weight: 600; }
.task small { color: var(--t3); font: 12px var(--mono); }
.search { width: 100%; max-width: 640px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-alt); color: var(--t1); font: inherit; }
.empty { color: var(--t3); }
.field { width: 100%; max-width: 560px; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--t1); }
.field:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
.refusal { margin-top: 10px; color: var(--red); font-size: 14px; }
.search.menu { max-width: 360px; border-radius: 999px; margin-bottom: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--divider); background: var(--bg-alt); text-align: left; transition: border-color .15s, background .15s; }
.card:hover { border-color: var(--border); background: var(--bg-soft); }
.card.on { border-color: var(--brand-2); background: var(--brand-soft); }
.card .dot, .card .box { width: 18px; height: 18px; border: 2px solid var(--border); flex: none; display: grid; place-items: center; font-size: 12px; color: var(--btn-text); }
.card .dot { border-radius: 50%; }
.card .box { border-radius: 5px; }
.card.on .dot { border-color: var(--brand-1); background: radial-gradient(var(--brand-1) 40%, transparent 45%); }
.card.on .box { border-color: var(--brand-1); background: var(--brand-1); }
.actions { display: flex; gap: 10px; }
.cols { display: flex; border: 1px solid var(--divider); border-radius: 12px; height: 320px; background: var(--bg-alt); overflow-x: auto; }
.col { flex: none; width: 220px; border-right: 1px solid var(--divider); overflow-y: auto; padding: 6px; }
.col:last-child { border-right: none; flex: 1; min-width: 220px; }
.ent { display: flex; width: 100%; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 14px; text-align: left; color: var(--t2); white-space: nowrap; }
.ent:hover { background: var(--bg-soft); }
.ent.open { background: var(--alt-hover); color: var(--t1); }
.ent.sel { background: var(--brand-2); color: var(--btn-text); }
.ent.empty { color: var(--t3); cursor: default; }
.ent .chev { color: var(--t3); }
.ent.sel .chev { color: var(--btn-text); }
.picked { font-size: 14px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.picked code { font-family: var(--mono); color: var(--brand-1); }
.solo { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--t2); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const token = new URLSearchParams(location.search).get('token');
const app = document.getElementById('app');
let snap = null;
let received = 0;
let clock = null;

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, val] of Object.entries(attrs || {})) {
    if (key === 'class') node.className = val;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), val);
    else node.setAttribute(key, val);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
}

function duration(ms) {
  const secs = ms / 1000;
  if (secs >= 60) return Math.floor(secs / 60) + 'm' + String(Math.floor(secs % 60)).padStart(2, '0') + 's';
  return secs.toFixed(1) + 's';
}

function post(name, body) {
  return fetch('/actions/' + name + '?token=' + encodeURIComponent(token), { method: 'POST', body: JSON.stringify(body || {}) });
}

function rail(s) {
  const marks = { running: '●', done: '✓', failed: '✗' };
  const section = (title, entries) => entries.length ? [
    el('div', { class: 'sep' }, title),
    el('ul', { class: 'steps' }, entries.map(e => el('li', { class: e.state || '' },
      el('span', { class: 'm' }, marks[e.state] || '·'), el('span', {}, e.label, e.value ? ': ' + e.value : '')))),
  ] : [];
  return el('aside', { class: 'rail' },
    el('div', { class: 'logo' }, el('i'), 'hobnob'),
    el('div', { class: 'taskname' }, el('b', {}, s.task.info || s.task.name), s.task.info ? s.task.name : ''),
    el('div', {}, section('Your answers', s.rail.answers), section('Setup', s.rail.setup)));
}

function progress(s) {
  const elapsed = el('div', { class: 'clock' });
  const tick = () => { elapsed.textContent = duration(s.progress.elapsedMs + Date.now() - received); };
  tick();
  clock = setInterval(tick, 200);
  return {
    body: [el('h1', {}, s.progress.cancelling ? 'Stopping…' : s.progress.label), el('div', { class: 'progress' }),
      el('div', { class: 'lastbox' }, s.progress.lastLine), elapsed],
    bar: [el('button', { class: 'btn alt', onclick: () => post('cancel') }, s.progress.cancelling ? 'Force stop' : 'Cancel'),
      el('span', { class: 'note' }, 'Keep this window open while hobnob runs.')],
  };
}

function homeButton(s) {
  return s.result.home ? el('button', { class: 'btn brand', onclick: () => post('home') }, 'Home') : null;
}

function tasks(s) {
  const list = el('ul', { class: 'tasks' });
  const search = el('input', { class: 'search', type: 'search', placeholder: 'Search tasks', 'aria-label': 'Search tasks' });
  const fill = () => {
    const needle = search.value.trim().toLowerCase();
    const shown = s.tasks.filter(t => (t.name + ' ' + t.info).toLowerCase().includes(needle));
    list.replaceChildren(...(shown.length ? shown.map(t => el('li', {}, el('button', { class: 'task', onclick: () => post('choose', { task: t.name }) },
      el('b', {}, t.info || t.name), t.info ? el('small', {}, t.name) : null))) : [el('li', { class: 'empty' }, 'No tasks to show.')]));
  };
  search.addEventListener('input', fill);
  fill();
  app.replaceChildren(el('div', { class: 'solo' }, el('div', { style: 'text-align: left; width: 640px; max-width: 100%' },
    el('div', { class: 'logo' }, el('i'), 'hobnob'), el('h1', { style: 'margin-top: 28px' }, 'What would you like to do?'), search, list)));
  setTimeout(() => search.focus());
}

let draft = { id: null, text: '', touched: false };

let menuDraft = { id: null, picks: [], filter: '' };

function menu(s) {
  const p = s.prompt;
  if (menuDraft.id !== p.id) menuDraft = { id: p.id, picks: p.multi ? [...(p.defaults || [])] : (p.hasDefault ? [p.default] : []), filter: '' };
  const cards = el('div', { class: 'cards', role: p.multi ? 'group' : 'radiogroup' });
  const count = el('span', { class: 'note', id: 'count' });
  const send = () => post('answer', { id: p.id, value: p.multi ? menuDraft.picks : (menuDraft.picks[0] || '') });
  const fill = () => {
    const needle = menuDraft.filter.trim().toLowerCase();
    const shown = p.options.filter(o => o.toLowerCase().includes(needle));
    cards.replaceChildren(...(shown.length ? shown.map(o => {
      const on = menuDraft.picks.includes(o);
      return el('button', { class: 'card' + (on ? ' on' : ''), role: p.multi ? 'checkbox' : 'radio', 'aria-checked': String(on),
        onclick: () => {
          if (!p.multi) menuDraft.picks = [o];
          else menuDraft.picks = menuDraft.picks.includes(o) ? menuDraft.picks.filter(x => x !== o) : [...menuDraft.picks, o];
          fill();
        } }, el('span', { class: p.multi ? 'box' : 'dot' }, p.multi && on ? '✓' : ''), o);
    }) : [el('div', { class: 'empty' }, 'No options match.')]));
    count.textContent = p.multi ? menuDraft.picks.length + ' selected' : '';
  };
  fill();
  const body = [el('h1', {}, p.info || p.varName)];
  if (p.options.length > 6) {
    const search = el('input', { class: 'search menu', type: 'search', placeholder: 'Search', 'aria-label': 'Search options', autocomplete: 'off' });
    search.value = menuDraft.filter;
    search.addEventListener('input', () => { menuDraft.filter = search.value; fill(); });
    body.push(search);
    setTimeout(() => search.focus(), 0);
  }
  body.push(cards, p.refusal ? el('div', { class: 'refusal', id: 'refusal' }, p.refusal) : null);
  const buttons = [];
  if (p.optional) buttons.push(el('button', { class: 'btn alt', id: 'skip', onclick: () => post('skip', { id: p.id }) }, 'Skip'));
  buttons.push(el('button', { class: 'btn brand', id: 'continue', onclick: send }, 'Continue'));
  return { body, bar: [count, el('div', { class: 'actions' }, buttons)] };
}

function ask(s) {
  const p = s.prompt;
  if (p.kind === 'menu') return menu(s);
  if (draft.id !== p.id) draft = { id: p.id, text: p.default || '', touched: false };
  const send = () => post('answer', { id: p.id, value: p.secret && p.hasDefault && !draft.touched ? null : draft.text });
  const field = el('input', { class: 'field', type: p.secret ? 'password' : 'text', id: 'answer',
    autocomplete: 'off', spellcheck: 'false', placeholder: p.hasDefault && p.secret ? '••••' : '',
    onkeydown: (event) => { if (event.key === 'Enter') send(); } });
  field.value = draft.text;
  field.addEventListener('input', () => { draft.text = field.value; draft.touched = true; });
  setTimeout(() => field.focus(), 0);
  const buttons = [];
  if (p.optional) buttons.push(el('button', { class: 'btn alt', id: 'skip', onclick: () => post('skip', { id: p.id }) }, 'Skip'));
  buttons.push(el('button', { class: 'btn brand', id: 'continue', onclick: send }, 'Continue'));
  return {
    body: [el('h1', {}, p.info || p.varName), field, p.refusal ? el('div', { class: 'refusal', id: 'refusal' }, p.refusal) : null],
    bar: [el('span'), el('div', { class: 'actions' }, buttons)],
  };
}

let pick = { id: null, selected: [] };

function picker(s) {
  const p = s.prompt, v = p.picker;
  if (pick.id !== p.id) pick = { id: p.id, selected: v.selected.slice() };
  const folderPicker = v.type === 'dir';
  const join = (dir, name) => (dir.endsWith('/') ? dir : dir + '/') + name;
  const openFolder = (path) => post('open', { id: p.id, path });
  const choose = (path, entry) => {
    if (v.multi) {
      const at = pick.selected.indexOf(path);
      if (at >= 0) pick.selected.splice(at, 1); else pick.selected.push(path);
      render();
    } else if (folderPicker) openFolder(path);
    else pick.selected = [path], render();
  };
  const cols = v.columns.map(col => el('div', { class: 'col' }, col.entries.length ? col.entries.map(e => {
    const path = join(col.path, e.name);
    const picked = (folderPicker && !v.multi && v.open === path) || pick.selected.includes(path);
    const cls = 'ent' + (picked ? ' sel' : col.next === e.name ? ' open' : '');
    if (e.dir && !e.pickable) return el('button', { class: cls, onclick: () => openFolder(path) }, el('span', {}, e.name), el('span', { class: 'chev' }, '›'));
    if (e.dir) return el('button', { class: cls, onclick: () => choose(path, e), ondblclick: () => openFolder(path) },
      el('span', {}, e.name), v.multi ? el('span', { class: 'chev', onclick: (event) => { event.stopPropagation(); openFolder(path); } }, '›') : el('span', { class: 'chev' }, '›'));
    return el('button', { class: cls, onclick: () => choose(path, e) }, el('span', {}, e.name));
  }) : el('div', { class: 'ent empty' }, 'Nothing to pick here')));
  const answer = folderPicker && !v.multi ? [v.open] : pick.selected;
  const ready = folderPicker && !v.multi ? v.openPickable : answer.length > 0;
  const statement = v.multi ? (answer.length ? answer.length + ' selected' : 'Nothing picked yet')
    : answer.length && ready ? el('span', {}, (folderPicker ? 'Folder: ' : 'Picked: '), el('code', {}, answer[0])) : 'Nothing picked yet';
  const send = () => post('answer', { id: p.id, value: v.multi ? answer : (answer[0] || '') });
  const buttons = [];
  if (p.optional) buttons.push(el('button', { class: 'btn alt', id: 'skip', onclick: () => post('skip', { id: p.id }) }, 'Skip'));
  buttons.push(el('button', { class: 'btn brand', id: 'continue', onclick: send }, 'Continue'));
  return {
    body: [el('h1', {}, p.info || p.varName), el('div', { class: 'cols' }, cols), p.refusal ? el('div', { class: 'refusal', id: 'refusal' }, p.refusal) : null],
    bar: [el('span', { class: 'picked', id: 'picked' }, statement), el('div', { class: 'actions' }, buttons)],
  };
}

function result(s) {
  const r = s.result;
  const copy = el('button', { class: 'btn alt', onclick: async () => {
    await navigator.clipboard.writeText(r.log);
    copy.textContent = 'Copied';
  } }, 'Copy details');
  if (r.outcome === 'done') {
    return {
      body: [el('div', { class: 'icon ok' }, '✓'), el('h1', {}, "You're all set"),
        el('p', { class: 'lead' }, (s.task.info || s.task.name) + ' finished in ' + duration(r.durationMs) + '.')],
      bar: [el('span', { class: 'note' }, s.result.home ? '' : 'You can close this window.'), homeButton(s)],
    };
  }
  const cancelled = r.outcome === 'cancelled';
  return {
    body: [el('div', { class: 'icon bad' }, cancelled ? '■' : '✗'),
      el('h1', {}, cancelled ? 'Cancelled' : 'Something went wrong'),
      cancelled ? null : el('p', { class: 'lead' }, r.label ? 'Failed at: ' + r.label : 'The run failed.'),
      r.lastLine ? el('div', { class: 'lastbox' }, r.lastLine) : null],
    bar: [el('span'), el('span', {}, cancelled ? null : copy, ' ', homeButton(s))],
  };
}

function render() {
  clearInterval(clock);
  const s = snap;
  if (s.screen === 'tasks') return tasks(s);
  const screen = s.screen === 'prompt' ? (s.prompt.kind === 'path' ? picker(s) : ask(s)) : s.screen === 'progress' ? progress(s) : result(s);
  app.replaceChildren(el('div', { class: 'shell' }, rail(s),
    el('div', { class: 'main' }, el('main', { class: 'pagebody' }, screen.body), el('footer', { class: 'bar' }, screen.bar))));
}

function stopped() {
  clearInterval(clock);
  app.replaceChildren(el('div', { class: 'solo' }, 'hobnob has stopped.'));
}

const events = new EventSource('/events?token=' + encodeURIComponent(token));
events.onmessage = (event) => { snap = JSON.parse(event.data); received = Date.now(); render(); };
events.onerror = () => {
  events.close();
  if (!snap || (snap.screen !== 'done' && snap.screen !== 'failed')) stopped();
};
</script>
</body>
</html>
