<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hobnob</title>
<style>
:root {
  --bg: #1a2029; --bg-alt: #151a22; --bg-soft: #252d38; --term: #0f131a;
  --divider: #2e3744; --border: #3a4452;
  --t1: #eef1f5; --t2: #aeb7c3; --t3: #768191;
  --brand-1: #f6c27a; --brand-2: #e0a050; --brand-3: #d98a35; --brand-soft: rgba(217, 138, 53, 0.16);
  --btn-text: #1a2029; --alt-bg: #2c3542; --alt-hover: #3a4452;
  --red: #ff6b6b; --green: #4ec27a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --bg-alt: #f6f6f7; --bg-soft: #f1f1f3; --term: #f6f6f7;
    --divider: #e2e2e3; --border: #c2c2c4;
    --t1: #3c3c43; --t2: #67676c; --t3: #929295;
    --brand-1: #d98a35; --brand-2: #c77a28; --brand-3: #b86a1c; --brand-soft: rgba(217, 138, 53, 0.14);
    --btn-text: #ffffff; --alt-bg: #ebebef; --alt-hover: #dedee3;
    --red: #d03a3a; --green: #2f9d5b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--t1); font: 15px/1.6 var(--sans); }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
.btn { padding: 0 22px; border-radius: 24px; line-height: 40px; font-size: 15px; font-weight: 600; transition: background .2s; }
.btn.brand { color: var(--btn-text); background: var(--brand-2); }
.btn.brand:hover { background: var(--brand-1); }
.btn.alt { color: var(--t1); background: var(--alt-bg); }
.btn.alt:hover { background: var(--alt-hover); }
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--bg-alt); border-right: 1px solid var(--divider); padding: 28px 24px; display: flex; flex-direction: column; gap: 28px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--brand-1); font-size: 18px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(-45deg, #d98a35 50%, #3b4654 50%); display: inline-block; }
.taskname { font-size: 13px; color: var(--t3); }
.taskname b { display: block; font-size: 16px; color: var(--t1); font-weight: 600; margin-bottom: 2px; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.steps li { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--t3); }
.steps .m { width: 16px; text-align: center; flex: none; }
.steps li.done { color: var(--t2); }
.steps li.done .m { color: var(--green); }
.steps li.running { background: var(--brand-soft); color: var(--t1); }
.steps li.running .m { color: var(--brand-1); }
.steps li.failed { color: var(--t1); }
.steps li.failed .m { color: var(--red); }
.sep { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); padding: 12px 10px 4px; }
.main { display: flex; flex-direction: column; min-height: 100vh; }
.pagebody { flex: 1; padding: 9vh 56px 40px; max-width: 900px; width: 100%; }
h1 { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; margin: 0 0 28px; }
.bar { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 56px; border-top: 1px solid var(--divider); background: var(--bg); }
.bar .note { font-size: 13px; color: var(--t3); }
.progress { height: 6px; border-radius: 3px; background: var(--bg-soft); overflow: hidden; max-width: 520px; position: relative; }
.progress::after { content: ''; position: absolute; inset: 0; width: 35%; border-radius: 3px; background: linear-gradient(90deg, var(--brand-3), var(--brand-1)); animation: indet 1.4s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
.lastbox { margin-top: 18px; max-width: 520px; padding: 10px 14px; border-radius: 10px; background: var(--term); border: 1px solid var(--divider); font: 13px var(--mono); color: var(--t3); white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 42px; }
.clock { margin-top: 10px; font: 13px var(--mono); color: var(--t3); }
.icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; margin-bottom: 22px; }
.icon.ok { background: rgba(78,194,122,.15); color: var(--green); }
.icon.bad { background: rgba(255,107,107,.12); color: var(--red); }
.lead { color: var(--t2); max-width: 560px; margin: -14px 0 24px; }
.solo { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--t2); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const token = new URLSearchParams(location.search).get('token');
const app = document.getElementById('app');
let snap = null;
let received = 0;
let clock = null;

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, val] of Object.entries(attrs || {})) {
    if (key === 'class') node.className = val;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), val);
    else node.setAttribute(key, val);
  }
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
}

function duration(ms) {
  const secs = ms / 1000;
  if (secs >= 60) return Math.floor(secs / 60) + 'm' + String(Math.floor(secs % 60)).padStart(2, '0') + 's';
  return secs.toFixed(1) + 's';
}

function post(name, body) {
  return fetch('/actions/' + name + '?token=' + encodeURIComponent(token), { method: 'POST', body: JSON.stringify(body || {}) });
}

function rail(s) {
  const marks = { running: '●', done: '✓', failed: '✗' };
  const section = (title, entries) => entries.length ? [
    el('div', { class: 'sep' }, title),
    el('ul', { class: 'steps' }, entries.map(e => el('li', { class: e.state || '' },
      el('span', { class: 'm' }, marks[e.state] || '·'), el('span', {}, e.label, e.value ? ': ' + e.value : '')))),
  ] : [];
  return el('aside', { class: 'rail' },
    el('div', { class: 'logo' }, el('i'), 'hobnob'),
    el('div', { class: 'taskname' }, el('b', {}, s.task.info || s.task.name), s.task.info ? s.task.name : ''),
    el('div', {}, section('Your answers', s.rail.answers), section('Setup', s.rail.setup)));
}

function progress(s) {
  const elapsed = el('div', { class: 'clock' });
  const tick = () => { elapsed.textContent = duration(s.progress.elapsedMs + Date.now() - received); };
  tick();
  clock = setInterval(tick, 200);
  return {
    body: [el('h1', {}, s.progress.cancelling ? 'Stopping…' : s.progress.label), el('div', { class: 'progress' }),
      el('div', { class: 'lastbox' }, s.progress.lastLine), elapsed],
    bar: [el('button', { class: 'btn alt', onclick: () => post('cancel') }, s.progress.cancelling ? 'Force stop' : 'Cancel'),
      el('span', { class: 'note' }, 'Keep this window open while hobnob runs.')],
  };
}

function result(s) {
  const r = s.result;
  const copy = el('button', { class: 'btn alt', onclick: async () => {
    await navigator.clipboard.writeText(r.log);
    copy.textContent = 'Copied';
  } }, 'Copy details');
  if (r.outcome === 'done') {
    return {
      body: [el('div', { class: 'icon ok' }, '✓'), el('h1', {}, "You're all set"),
        el('p', { class: 'lead' }, (s.task.info || s.task.name) + ' finished in ' + duration(r.durationMs) + '.')],
      bar: [el('span'), el('span', { class: 'note' }, 'You can close this window.')],
    };
  }
  const cancelled = r.outcome === 'cancelled';
  return {
    body: [el('div', { class: 'icon bad' }, cancelled ? '■' : '✗'),
      el('h1', {}, cancelled ? 'Cancelled' : 'Something went wrong'),
      cancelled ? null : el('p', { class: 'lead' }, r.label ? 'Failed at: ' + r.label : 'The run failed.'),
      r.lastLine ? el('div', { class: 'lastbox' }, r.lastLine) : null],
    bar: [el('span'), cancelled ? el('span') : copy],
  };
}

function render() {
  clearInterval(clock);
  const s = snap;
  const screen = s.screen === 'progress' ? progress(s) : result(s);
  app.replaceChildren(el('div', { class: 'shell' }, rail(s),
    el('div', { class: 'main' }, el('main', { class: 'pagebody' }, screen.body), el('footer', { class: 'bar' }, screen.bar))));
}

function stopped() {
  clearInterval(clock);
  app.replaceChildren(el('div', { class: 'solo' }, 'hobnob has stopped.'));
}

const events = new EventSource('/events?token=' + encodeURIComponent(token));
events.onmessage = (event) => { snap = JSON.parse(event.data); received = Date.now(); render(); };
events.onerror = () => {
  events.close();
  if (!snap || snap.screen === 'progress') stopped();
};
</script>
</body>
</html>
