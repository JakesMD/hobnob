name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Vet, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        env:
          GOTOOLCHAIN: auto

      - name: Check
        run: ./hobnob go:check
        env:
          GOTOOLCHAIN: auto

      - name: Vulnerability scan
        run: ./hobnob go:vuln
        env:
          GOTOOLCHAIN: auto

  windows:
    name: Windows build, vet & ConPTY tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: ConPTY tests
        run: go test ./internal/runner ./internal/e2e -run 'ConPTY|PTY'

  test-install-script:
    name: Test Install Script (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-latest # darwin/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run install script
        run: bash ./install.sh

      - name: Verify binary
        run: PATH="$HOME/.local/bin:$PATH" hobnob go:verify

  test-setup-action:
    name: Test Setup Action (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-latest # darwin/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: ./
