name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: ./hobnob go:build:release OS=${{ matrix.os }} ARCH=${{ matrix.arch }} VERSION=${{ github.ref_name }}

      - name: Package
        run: ./hobnob go:package OS=${{ matrix.os }} ARCH=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: hobnob_${{ matrix.os }}_${{ matrix.arch }}
          path: hobnob_${{ matrix.os }}_${{ matrix.arch }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Stamp install script version
        run: sed -i 's/VERSION="${HOBNOB_VERSION:-latest}"/VERSION="${HOBNOB_VERSION:-${{ github.ref_name }}}"/' install.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            install.sh
            GUIDE.md
          generate_release_notes: true

  update-major-tag:
    name: Update major version tag
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"
