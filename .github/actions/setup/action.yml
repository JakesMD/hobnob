name: Setup hobnob
description: Checks out, sets up Go, and builds the hobnob bootstrap binary.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Bootstrap hobnob
      shell: bash
      run: go build -o ./hobnob ./cmd/hobnob
