version: "2"

linters:
  default: standard
  enable:
    - testconventions
  settings:
    errcheck:
      # Terminal output and cleanup are best-effort: a failed write to the
      # user's terminal or a failed close of a drained pipe has no recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        - (*hobnob/internal/tui.LineWriter).Write
        - (io.Closer).Close
        - (*os.File).Close
        - os.RemoveAll
        - syscall.Close
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
    custom:
      testconventions:
        type: module
        description: Enforces a given/when/then (why) comment and Arrange/Act/Assert markers in every test

formatters:
  enable:
    - gofmt
